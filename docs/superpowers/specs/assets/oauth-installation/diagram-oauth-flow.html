<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slack OAuth Installation — Sequence Flow</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 24px; }
  h2 { color: #a78bfa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
  svg { width: 100%; max-width: 900px; display: block; margin: 0 auto; }
  .actor-box { fill: #1e293b; stroke: #334155; }
  .actor-label { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  .lifeline { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,3; }
  .msg { stroke: #7dd3fc; stroke-width: 1.5; fill: none; marker-end: url(#arr-blue); }
  .msg-return { stroke: #34d399; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; marker-end: url(#arr-green); }
  .msg-err { stroke: #f87171; stroke-width: 1.5; fill: none; marker-end: url(#arr-red); }
  .msg-label { font-size: 10px; fill: #94a3b8; font-family: 'Courier New', monospace; }
  .note { font-size: 9.5px; fill: #64748b; }
  .box-activate { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1; }
  .box-slack { fill: #064e3b; stroke: #10b981; stroke-width: 1; }
  .box-db { fill: #312e81; stroke: #7c3aed; stroke-width: 1; }
  .phase-label { font-size: 10px; fill: #a78bfa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .badge { font-size: 9px; fill: #fff; font-weight: 600; }
  .badge-bg-ok { fill: #065f46; }
  .badge-bg-err { fill: #7f1d1d; }
</style>
</head>
<body>
<h2>OAuth Installation Sequence Flow</h2>
<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7dd3fc"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#34d399"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Actor boxes -->
  <!-- Browser: x=60 -->
  <rect x="20" y="16" width="100" height="36" rx="6" class="actor-box"/>
  <text x="70" y="30" class="actor-label" text-anchor="middle" font-size="11">Browser</text>
  <text x="70" y="44" class="actor-label" text-anchor="middle" font-size="9" fill="#64748b">(Slack Admin)</text>

  <!-- oauth.js: x=220 -->
  <rect x="180" y="16" width="110" height="36" rx="6" class="actor-box"/>
  <text x="235" y="30" class="actor-label" text-anchor="middle" font-size="11">server.js</text>
  <text x="235" y="44" class="actor-label" text-anchor="middle" font-size="9" fill="#7dd3fc">+ oauth.js</text>

  <!-- Slack: x=430 -->
  <rect x="390" y="16" width="100" height="36" rx="6" fill="#0a2a1a" stroke="#10b981"/>
  <text x="440" y="34" class="actor-label" text-anchor="middle" font-size="11" fill="#6ee7b7">Slack API</text>

  <!-- db.js: x=620 -->
  <rect x="590" y="16" width="80" height="36" rx="6" fill="#1a1040" stroke="#7c3aed"/>
  <text x="630" y="30" class="actor-label" text-anchor="middle" font-size="11">db.js</text>
  <text x="630" y="44" class="actor-label" text-anchor="middle" font-size="9" fill="#a78bfa">+ crypto.js</text>

  <!-- crypto.js: x=740 -->
  <rect x="720" y="16" width="80" height="36" rx="6" fill="#1a1040" stroke="#4f46e5"/>
  <text x="760" y="34" class="actor-label" text-anchor="middle" font-size="11">SQLite</text>

  <!-- Lifelines -->
  <line x1="70"  y1="52" x2="70"  y2="690" class="lifeline"/>
  <line x1="235" y1="52" x2="235" y2="690" class="lifeline"/>
  <line x1="440" y1="52" x2="440" y2="690" class="lifeline"/>
  <line x1="630" y1="52" x2="630" y2="690" class="lifeline"/>
  <line x1="760" y1="52" x2="760" y2="690" class="lifeline"/>

  <!-- PHASE 1: Install -->
  <text x="18" y="80" class="phase-label">1 — Install Request</text>

  <!-- GET /slack/install -->
  <line x1="72" y1="94" x2="233" y2="94" class="msg"/>
  <text x="152" y="88" class="msg-label" text-anchor="middle">GET /slack/install</text>

  <!-- generate state -->
  <rect x="220" y="100" width="30" height="30" rx="2" class="box-activate"/>
  <text x="235" y="120" class="note" text-anchor="middle">gen state</text>

  <!-- redirect to Slack -->
  <line x1="237" y1="138" x2="438" y2="138" class="msg"/>
  <text x="337" y="131" class="msg-label" text-anchor="middle">302 → oauth/v2/authorize?state=…</text>

  <!-- PHASE 2: Slack Auth -->
  <text x="18" y="166" class="phase-label">2 — Slack Auth Page</text>

  <!-- Slack renders consent -->
  <rect x="420" y="172" width="40" height="24" rx="2" class="box-slack"/>
  <text x="440" y="188" class="note" text-anchor="middle" fill="#6ee7b7">consent</text>

  <!-- user approves -->
  <line x1="438" y1="200" x2="72" y2="200" class="msg-return"/>
  <text x="255" y="194" class="msg-label" text-anchor="middle">302 → /slack/oauth/callback?code=…&amp;state=…</text>

  <!-- PHASE 3: Callback -->
  <text x="18" y="228" class="phase-label">3 — Callback (happy path)</text>

  <line x1="72" y1="242" x2="233" y2="242" class="msg"/>
  <text x="152" y="236" class="msg-label" text-anchor="middle">GET /slack/oauth/callback?code&amp;state</text>

  <!-- validate state -->
  <rect x="220" y="248" width="30" height="24" rx="2" class="box-activate"/>
  <text x="235" y="264" class="note" text-anchor="middle">✓ state</text>

  <!-- exchange code -->
  <line x1="237" y1="280" x2="438" y2="280" class="msg"/>
  <text x="337" y="274" class="msg-label" text-anchor="middle">oauth.v2.access(code)</text>

  <rect x="420" y="286" width="40" height="24" rx="2" class="box-slack"/>
  <text x="440" y="302" class="note" text-anchor="middle" fill="#6ee7b7">verify</text>

  <!-- Slack returns token -->
  <line x1="438" y1="316" x2="237" y2="316" class="msg-return"/>
  <text x="337" y="310" class="msg-label" text-anchor="middle">{team.id, team.name, access_token}</text>

  <!-- upsertWorkspaceFromOAuth -->
  <rect x="220" y="322" width="30" height="24" rx="2" class="box-activate"/>
  <text x="235" y="338" class="note" text-anchor="middle">upsert</text>

  <line x1="237" y1="350" x2="628" y2="350" class="msg"/>
  <text x="432" y="344" class="msg-label" text-anchor="middle">upsertWorkspaceFromOAuth(teamId, botToken…)</text>

  <!-- db encrypts -->
  <line x1="632" y1="366" x2="758" y2="366" class="msg"/>
  <text x="695" y="360" class="msg-label" text-anchor="middle">encrypt(botToken)</text>

  <line x1="758" y1="380" x2="632" y2="380" class="msg-return"/>
  <text x="695" y="374" class="msg-label" text-anchor="middle">iv:ct:tag</text>

  <!-- INSERT/UPDATE workspaces -->
  <rect x="745" y="386" width="30" height="24" rx="2" fill="#1e293b" stroke="#4f46e5"/>
  <text x="760" y="402" class="note" text-anchor="middle">UPSERT</text>

  <line x1="628" y1="416" x2="237" y2="416" class="msg-return"/>
  <text x="432" y="410" class="msg-label" text-anchor="middle">ok</text>

  <!-- 302 success -->
  <line x1="235" y1="432" x2="72" y2="432" class="msg-return"/>
  <rect x="102" y="420" width="82" height="14" rx="3" class="badge-bg-ok"/>
  <text x="143" y="430" class="badge" text-anchor="middle">302 → /slack/install/success</text>

  <!-- PHASE 4: Error paths -->
  <text x="18" y="462" class="phase-label">4 — Error Paths</text>

  <!-- invalid state -->
  <line x1="72" y1="476" x2="233" y2="476" class="msg"/>
  <text x="152" y="470" class="msg-label" text-anchor="middle">callback (bad state / expired)</text>

  <line x1="235" y1="490" x2="72" y2="490" class="msg-err"/>
  <rect x="82" y="480" width="98" height="14" rx="3" class="badge-bg-err"/>
  <text x="131" y="490" class="badge" text-anchor="middle">400 HTML error page</text>

  <!-- invalid code -->
  <line x1="72" y1="516" x2="233" y2="516" class="msg"/>
  <text x="152" y="510" class="msg-label" text-anchor="middle">callback (Slack rejects code)</text>

  <line x1="237" y1="530" x2="438" y2="530" class="msg"/>
  <text x="337" y="524" class="msg-label" text-anchor="middle">oauth.v2.access(bad code)</text>

  <line x1="438" y1="544" x2="237" y2="544" class="msg-err"/>
  <text x="337" y="538" class="msg-label" text-anchor="middle">error</text>

  <line x1="235" y1="558" x2="72" y2="558" class="msg-err"/>
  <rect x="82" y="546" width="98" height="14" rx="3" class="badge-bg-err"/>
  <text x="131" y="556" class="badge" text-anchor="middle">400 HTML error page</text>

  <!-- PHASE 5: Startup validation -->
  <text x="18" y="590" class="phase-label">5 — Startup Validation</text>

  <rect x="220" y="600" width="30" height="36" rx="2" fill="#450a0a" stroke="#dc2626"/>
  <text x="235" y="616" class="note" text-anchor="middle" fill="#fca5a5">FAIL</text>
  <text x="235" y="628" class="note" text-anchor="middle" fill="#fca5a5">FAST</text>

  <line x1="235" y1="640" x2="72" y2="640" class="msg-err"/>
  <text x="152" y="634" class="msg-label" text-anchor="middle">process.exit(1) — missing env vars</text>

  <!-- startup note -->
  <text x="260" y="656" class="note">validateSlackEnvVars() called in start() before HTTP server binds</text>
  <text x="260" y="668" class="note">Fails fast if SLACK_CLIENT_ID or SLACK_CLIENT_SECRET missing</text>
</svg>
</body>
</html>
