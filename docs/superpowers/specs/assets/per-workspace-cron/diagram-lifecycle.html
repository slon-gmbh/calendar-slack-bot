<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Per-Workspace Cron — Lifecycle Sequence</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; margin: 0; padding: 24px; }
  h2 { color: #a78bfa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
  svg { width: 100%; max-width: 900px; display: block; margin: 0 auto; }
  .phase-label { font-size: 10px; fill: #a78bfa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .msg-label { font-size: 10px; fill: #94a3b8; font-family: 'Courier New', monospace; }
  .note { font-size: 9.5px; fill: #64748b; }
  .actor-label { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<h2>Per-Workspace Cron — Lifecycle Sequence</h2>
<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#7dd3fc"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#34d399"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#a78bfa"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f87171"/>
    </marker>
    <marker id="arr-yellow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- Actor boxes: server.js(60), registry(200), db.js(370), runner.js(530), node-cron(700) -->
  <rect x="10" y="14" width="100" height="36" rx="6" fill="#1e293b" stroke="#7dd3fc"/>
  <text x="60" y="28" class="actor-label" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="middle">server.js</text>
  <text x="60" y="42" class="actor-label" fill="#64748b" font-size="9" text-anchor="middle">+ oauth.js / events.js</text>

  <rect x="155" y="14" width="90" height="36" rx="6" fill="#1a1040" stroke="#a78bfa"/>
  <text x="200" y="34" class="actor-label" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">scheduler</text>
  <text x="200" y="46" class="actor-label" fill="#64748b" font-size="9" text-anchor="middle">-registry.js</text>

  <rect x="320" y="14" width="80" height="36" rx="6" fill="#1e293b" stroke="#7c3aed"/>
  <text x="360" y="34" class="actor-label" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">db.js</text>

  <rect x="470" y="14" width="90" height="36" rx="6" fill="#1e293b" stroke="#818cf8"/>
  <text x="515" y="34" class="actor-label" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle">runner.js</text>

  <rect x="640" y="14" width="90" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="685" y="34" class="actor-label" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">node-cron</text>

  <!-- Lifelines -->
  <line x1="60" y1="50" x2="60" y2="710" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="50" x2="200" y2="710" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="50" x2="360" y2="710" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="515" y1="50" x2="515" y2="710" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="685" y1="50" x2="685" y2="710" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- PHASE 1: Startup -->
  <text x="10" y="72" class="phase-label">1 — Server Startup</text>

  <line x1="62" y1="84" x2="198" y2="84" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="130" y="78" class="msg-label" text-anchor="middle">scheduleAllWorkspaces(db)</text>

  <line x1="202" y1="98" x2="358" y2="98" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="280" y="92" class="msg-label" text-anchor="middle">listActiveWorkspaces(db)</text>

  <line x1="358" y1="112" x2="202" y2="112" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="280" y="106" class="msg-label" text-anchor="middle">[ws1, ws2, …]</text>

  <!-- Loop: for each workspace -->
  <rect x="190" y="120" width="510" height="78" rx="4" fill="none" stroke="#1e293b" stroke-width="1"/>
  <text x="196" y="134" class="note" fill="#475569">loop: for each active workspace</text>

  <line x1="202" y1="144" x2="513" y2="144" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="357" y="138" class="msg-label" text-anchor="middle">loadConfigFromDb(db, wsId)</text>

  <line x1="202" y1="160" x2="683" y2="160" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="440" y="154" class="msg-label" text-anchor="middle">cron.schedule(expr, fn) × N channels</text>

  <line x1="683" y1="174" x2="202" y2="174" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="440" y="168" class="msg-label" text-anchor="middle">CronTask[] stored in Map[wsId]</text>

  <text x="204" y="194" class="note">→ jobs registered for ws1 (digest_schedule × channels, change detection)</text>

  <!-- PHASE 2: Cron fires -->
  <text x="10" y="218" class="phase-label">2 — Scheduled Cron Firing (steady state)</text>

  <line x1="202" y1="230" x2="513" y2="230" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="357" y="224" class="msg-label" text-anchor="middle">runScheduledDigests(db, wsId, dryRun)</text>

  <line x1="515" y1="244" x2="361" y2="244" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="438" y="238" class="msg-label" text-anchor="middle">loadConfigFromDb(db, wsId) internally</text>

  <text x="204" y="264" class="note">each invocation loads fresh config; bot_token decrypted per workspace</text>

  <!-- PHASE 3: New Install -->
  <text x="10" y="288" class="phase-label">3 — New Workspace Install (dynamic, no restart)</text>

  <!-- Browser hits /slack/oauth/callback -->
  <rect x="10" y="298" width="20" height="80" rx="2" fill="#0a2a1a" stroke="#10b981"/>
  <text x="20" y="314" fill="#6ee7b7" font-size="9" text-anchor="middle" transform="rotate(-90 20 340)">Browser</text>

  <line x1="32" y1="308" x2="58" y2="308" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="45" y="302" class="note" fill="#6ee7b7">GET /callback</text>

  <rect x="46" y="316" width="28" height="50" rx="2" fill="#1e293b" stroke="#7dd3fc"/>
  <text x="60" y="345" class="note" text-anchor="middle">oauth</text>

  <line x1="62" y1="366" x2="62" y2="366"/>

  <!-- oauth calls upsertWorkspaceFromOAuth, then fires onInstall -->
  <line x1="74" y1="332" x2="198" y2="332" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="136" y="326" class="msg-label" text-anchor="middle">onInstall(newWsId) callback</text>

  <line x1="202" y1="348" x2="358" y2="348" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="280" y="342" class="msg-label" text-anchor="middle">loadConfigFromDb(db, newWsId)</text>

  <line x1="202" y1="364" x2="683" y2="364" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="440" y="358" class="msg-label" text-anchor="middle">cron.schedule() — jobs added to Map[newWsId]</text>

  <text x="74" y="388" class="note">workspace immediately active; no process restart needed</text>

  <!-- PHASE 4: Uninstall -->
  <text x="10" y="412" class="phase-label">4 — Workspace Uninstall (Slack Events API)</text>

  <rect x="10" y="422" width="20" height="80" rx="2" fill="#0a2a1a" stroke="#f59e0b"/>
  <text x="20" y="438" fill="#fcd34d" font-size="9" text-anchor="middle" transform="rotate(-90 20 462)">Slack</text>

  <line x1="32" y1="432" x2="58" y2="432" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-yellow)"/>
  <text x="45" y="426" class="note" fill="#fcd34d">POST /slack/events</text>

  <rect x="46" y="440" width="28" height="50" rx="2" fill="#1e293b" stroke="#f59e0b"/>
  <text x="60" y="469" class="note" text-anchor="middle">events</text>

  <!-- verify signing secret -->
  <text x="78" y="454" class="note" fill="#64748b">verify SLACK_SIGNING_SECRET</text>
  <text x="78" y="466" class="note" fill="#64748b">type == app_uninstalled</text>

  <line x1="74" y1="478" x2="198" y2="478" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="136" y="472" class="msg-label" text-anchor="middle">onUninstall(teamId) callback</text>

  <!-- registry: stop jobs -->
  <rect x="188" y="486" width="24" height="28" rx="2" fill="#450a0a" stroke="#dc2626"/>
  <text x="200" y="504" class="note" text-anchor="middle" fill="#fca5a5">stop</text>

  <line x1="202" y1="518" x2="683" y2="518" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="440" y="512" class="msg-label" text-anchor="middle">job.stop() for all jobs in Map[teamId]</text>

  <line x1="202" y1="534" x2="358" y2="534" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="280" y="528" class="msg-label" text-anchor="middle">markWorkspaceInactive(db, teamId)</text>

  <text x="74" y="556" class="note">Map entry deleted; workspace marked inactive; no restart needed</text>

  <!-- PHASE 5: Shutdown -->
  <text x="10" y="580" class="phase-label">5 — Graceful Shutdown (SIGTERM / SIGINT)</text>

  <line x1="62" y1="592" x2="198" y2="592" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="130" y="586" class="msg-label" text-anchor="middle">stopAll()</text>

  <line x1="202" y1="608" x2="683" y2="608" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="440" y="602" class="msg-label" text-anchor="middle">job.stop() for all jobs in all Map entries</text>

  <text x="74" y="628" class="note">server.js calls registry.stopAll() in shutdown() handler</text>
</svg>
</body>
</html>
